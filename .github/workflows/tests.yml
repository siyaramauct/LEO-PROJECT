# -----------------------------------------------------------------------------
# Tests
#
# Runs the project's checks and tests on GitHub's servers, then deploys, in
# three stages. Each starts only if the one before it passed:
#
#   1. checks       formatting, lint, type-check, build and the unit tests
#   2. integration  services and RLS against a fresh local Supabase
#   3. deploy       builds the app with the hosted Supabase values and uploads
#                   it to Cloudflare. Pushes to main only: pull requests are
#                   tested but never deployed.
#
# The end-to-end tests (Playwright, tests/e2e) aren't run here; run them
# locally with `npm run test:e2e`.
#
# Where things are:
#   This file must live in .github/workflows/ at the repository root (leo/),
#   the only place GitHub looks for workflows.
#   The app lives in leo-demo/, so every command below runs there (see
#   `defaults`). The root also has a package.json with wrapper scripts; running
#   there would install the wrong dependencies.
#
# Credentials:
#   integration  a throwaway local Supabase that the job starts itself, so no
#                GitHub Secrets (see leo-demo/.env.test.example)
#   deploy       repository Secrets CLOUDFLARE_API_TOKEN and
#                CLOUDFLARE_ACCOUNT_ID (the sponsor's Cloudflare account), and
#                repository Variables VITE_SUPABASE_URL and
#                VITE_SUPABASE_PUBLISHABLE_KEY (the hosted project; public by
#                design, so Variables rather than Secrets)
# -----------------------------------------------------------------------------

name: Tests

# -- When it runs --------------------------------------------------------------

on:
  # Pushes to main, including the commit a merged pull request creates.
  push:
    branches: [main]
  # Pull requests into main, and every new commit pushed to them, so code is
  # tested before it can be merged. Pushes to other branches don't run this.
  pull_request:
    branches: [main]

# Only the newest run matters: a new push to main, or to a pull request,
# cancels a run still going for it, so nobody waits on outdated results.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# -- Where commands run --------------------------------------------------------

# Every `run:` step starts in the app folder instead of the repository root.
defaults:
  run:
    working-directory: leo-demo

# -- Jobs ----------------------------------------------------------------------

jobs:
  # Fast checks that need no database: formatting, lint, types, build and the
  # unit tests. Usually done in a minute or two.
  checks:
    name: Lint, types, build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Download the repository onto the runner.
      - name: Check out the code
        uses: actions/checkout@v4

      # 2. Install the Node version from .nvmrc and reuse downloaded npm
      #    packages between runs. `uses:` steps ignore `defaults`, so the
      #    paths include leo-demo/.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: leo-demo/.nvmrc
          cache: npm
          cache-dependency-path: leo-demo/package-lock.json

      # 3. A clean install of exactly the versions in package-lock.json.
      - name: Install dependencies
        run: npm ci

      # 4. Every file matches Prettier's style.
      - name: Check formatting
        run: npm run format:check

      # 5. ESLint finds no problems.
      - name: Lint
        run: npm run lint

      # 6. tsc -b type-checks the app, the config files and the tests (see
      #    tsconfig.json), then Vite builds the app.
      - name: Type-check and build
        run: npm run build

      # 7. The unit tests (tests/unit). `--run` runs them once instead of
      #    watching for changes.
      - name: Unit tests
        run: npm test -- --run

  # The integration tests, against a fresh local Supabase in Docker built from
  # supabase/migrations and supabase/config.toml. Runs alongside `checks`.
  integration:
    name: Integration tests
    # Stage 2: only once the checks and unit tests have passed.
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Study days and streaks use South African dates (Africa/Johannesburg in
      # the database), so the runner's clock must agree. GitHub defaults to UTC.
      TZ: Africa/Johannesburg

    steps:
      # 1. Download the repository onto the runner.
      - name: Check out the code
        uses: actions/checkout@v4

      # 2. Node from .nvmrc, with npm downloads cached between runs.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: leo-demo/.nvmrc
          cache: npm
          cache-dependency-path: leo-demo/package-lock.json

      # 3. The Supabase CLI, the same version used locally to pull the schema.
      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      # 4. A clean install of exactly the versions in package-lock.json.
      - name: Install dependencies
        run: npm ci

      # 5. Start Supabase in Docker (already installed on the runner). Builds the
      #    database from the migrations and the buckets from config.toml. Only
      #    what the tests use is started: the database, auth (gotrue), the REST
      #    API (postgrest), storage and the gateway (kong).
      - name: Start local Supabase
        run: >-
          supabase start
          -x studio,postgres-meta,imgproxy,mailpit,realtime,edge-runtime,logflare,vector,supavisor

      # 6. Hand this run's local URL and keys to the tests. `supabase status`
      #    prints them; writing to $GITHUB_ENV makes them environment variables
      #    for every later step, and the integration config reads those ahead
      #    of .env.test. The secret key is masked so it never shows in the logs.
      - name: Pass the local Supabase credentials to the tests
        run: |
          supabase status -o env | grep -E '^[A-Z_]+=' > "$RUNNER_TEMP/supabase.env"
          set -a
          source "$RUNNER_TEMP/supabase.env"
          set +a

          echo "::add-mask::$SECRET_KEY"

          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
          } >> "$GITHUB_ENV"

      # 7. The integration tests (tests/integration), one file at a time.
      - name: Integration tests
        run: npm run test:integration

  # Puts the tested code live: builds the app and uploads dist/ to the
  # sponsor's Cloudflare account (see leo-demo/wrangler.jsonc).
  deploy:
    name: Deploy to Cloudflare
    # Stage 3: only once the integration tests have passed, and only for
    # pushes to main (pull requests are tested but never deployed).
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: leo-demo/.nvmrc
          cache: npm
          cache-dependency-path: leo-demo/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Vite writes these values into the built files, so they must be set
      # when it builds. They're the hosted project's, and public by design.
      - name: Build with the hosted Supabase values
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # Cloudflare's official action runs `wrangler deploy` with the Wrangler
      # version from package.json, uploading dist/ as wrangler.jsonc says.
      - name: Upload to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: leo-demo
          command: deploy
